name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite without a flag needs 22.13+
          node-version: "22.x"
          cache: npm

      # Lets the XLSX export test open the generated file with a real spreadsheet reader.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openpyxl
        run: python -m pip install --quiet openpyxl

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
